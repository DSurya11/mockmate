<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- The MockMate mark: a speech mark in an ink square. On a dark tab bar it turns to paper. -->
  <style>
    .tile { fill: #1d1b18; }
    .mark { stroke: #f6f2ea; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #f2eee6; }
      .mark { stroke: #1d1b18; }
    }
  </style>
  <rect class="tile" width="32" height="32" rx="7"/>
  <path class="mark" d="M8.2 9.2h15.6v9.5h-7.8l-5 3.9v-3.9H8.2z" stroke-width="2.4" stroke-linejoin="round"/>
</svg>
